<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VipherAid | Report an Animal</title>
  <link rel="stylesheet" href="/style.css">

</head>
<body>
  <header class="topbar">
    <div class="nav">
      <a class="link" href="/">← Home</a>
      <span class="page-title">Report an Animal</span>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Report an Injured / Distressed Animal</h2>
      <p class="muted">Photo is mandatory to help rescuers assess urgency.</p>

      <!-- For now this is UI-only. Later we will POST to Flask and store data. -->
      <form class="form" action="#" method="post" enctype="multipart/form-data">
        <div class="row">
          <div class="field">
            <label for="animalType">Animal Type</label>
            <select id="animalType" name="animal_type" required>
              <option value="" selected disabled>Choose one</option>
              <option>Dog</option>
              <option>Cat</option>
              <option>Bird</option>
              <option>Other</option>
            </select>
          </div>

          <div class="field">
            <label for="urgency">Urgency</label>
            <select id="urgency" name="urgency" required>
              <option value="" selected disabled>Choose one</option>
              <option>High (bleeding / cannot move)</option>
              <option>Medium (injured but stable)</option>
              <option>Low (needs help / food / shelter)</option>
            </select>
          </div>
        </div>
<div class="field">
          <label for="location">Location (landmark / area)</label>
          <input id="location" name="location" type="text" placeholder="Eg: Near Main Gate, Block A" required />
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="5" placeholder="Describe the situation, injury, behavior..." required></textarea>
        </div>

        <div class="field">
          <label for="photo">Upload Photo (Mandatory)</label>
          <input id="photo" name="photo" type="file" accept="image/*" required />
          <p class="hint">Tip: Use a clear photo showing the animal and surroundings.</p>
        </div>

        <div class="actions">
          <button class="btn primary" type="submit">Submit Report</button>
          <a class="btn ghost" href="/">Cancel</a>
        </div>

        <p class="note">
          Next step: connect this form to Flask (POST) and store reports.
        </p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <small>VipherAid • Report Page</small>
  </footer>
</body>
</html>
