<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Login - VipherAid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="va-login-bg">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="va-card p-4 p-lg-5">
        <div class="d-flex align-items-center gap-2 mb-3">
          <img src="{{ url_for('static', filename='logo.png') }}" class="va-logo-sm" alt="ViperAid">
          <strong>ViperAid</strong>
        </div>

        <h1 class="fw-bold mb-2">Welcome Back</h1>
        <p class="va-soft mb-4">Enter your name to start reporting. No password.</p>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-bold">Name *</label>
            <input name="name" class="form-control" required placeholder="Harini">
          </div>
          <div class="mb-4">
            <label class="form-label fw-bold">Phone (optional)</label>
            <input name="phone" class="form-control" placeholder="+91 XXXXX XXXXX">
          </div>

          <button class="va-btn w-100" type="submit">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>Continue to Report
          </button>

          <div class="d-flex justify-content-between mt-3">
            <a class="va-soft small" href="/">← Back to Home</a>
            <a class="va-soft small" href="/report">Skip (open report)</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
